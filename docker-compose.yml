services:
  tests:
    build: ./
    working_dir: /project
    entrypoint: ["/bin/sh", "-lc", "composer install --quiet && exec \"$@\"", "--"]
    command: ["./vendor/bin/phpunit"]
    volumes:
      - ./:/project
  coverage:
    build: ./
    working_dir: /project
    entrypoint: ["/bin/sh", "-lc", "composer install --quiet && exec \"$@\"", "--"]
    command: ["./vendor/bin/phpunit", "--coverage-text"]
    volumes:
      - ./:/project
    environment:
      - XDEBUG_MODE=coverage
  analysis:
    build: ./
    working_dir: /project
    entrypoint: ["/bin/sh", "-lc", "composer install --quiet && exec \"$@\"", "--"]
    command: ["./vendor/bin/phpstan", "analyze", "--memory-limit=512M"]
    volumes:
      - ./:/project
  standards:
    build: ./
    working_dir: /project
    entrypoint: ["/bin/sh", "-lc", "composer install --quiet && exec \"$@\"", "--"]
    command: ["./vendor/bin/phpcs"]
    volumes:
      - ./:/project
